<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Runner</title>
<style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050510; font-family: 'Segoe UI', Tahoma, sans-serif; }
    #game-container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
    .hud { display: flex; justify-content: space-between; align-items: center; color: #00f3ff; font-size: 1.5rem; font-weight: bold; text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff; direction: ltr; }
    .touch-jump-btn { pointer-events: auto; align-self: center; margin-bottom: 20px; padding: 16px 40px; font-size: 1.3rem; font-weight: bold; color: #fff; background: linear-gradient(135deg, #00f3ff, #b000ff); border: none; border-radius: 50px; box-shadow: 0 0 15px #00f3ff, 0 0 30px #b000ff; cursor: pointer; text-shadow: 0 0 5px #fff; }
    .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,16,0.85); backdrop-filter: blur(8px); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 10; }
    .modal h1 { font-size: 3rem; color: #ff0055; text-shadow: 0 0 10px #ff0055, 0 0 25px #ff0055; margin-bottom: 10px; text-transform: uppercase; }
    .modal p { font-size: 1.4rem; color: #fff; margin: 8px 0; text-shadow: 0 0 8px #00f3ff; }
    .modal-btn { margin-top: 25px; padding: 14px 35px; font-size: 1.3rem; font-weight: bold; color: #fff; background: linear-gradient(135deg, #b000ff, #ff0055); border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 0 15px #b000ff; }
    .hidden { display: none !important; }
</style>
</head>
<body>
<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="ui-layer">
        <div class="hud">
            <div>SCORE: <span id="scoreText">0</span></div>
            <div>HI: <span id="highScoreHUD">0</span></div>
        </div>
        <button id="jumpBtn" class="touch-jump-btn">JUMP ⚡</button>
    </div>
    <div id="gameModal" class="modal">
        <h1 id="modalTitle">NEON RUNNER</h1>
        <p id="finalScoreText" class="hidden">النتيجة: 0</p>
        <p id="highScoreText">أعلى نتيجة: 0</p>
        <button id="startBtn" class="modal-btn">ابدأ اللعب</button>
    </div>
</div>
<script>
(() => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const highScoreHUD = document.getElementById('highScoreHUD');
    const gameModal = document.getElementById('gameModal');
    const modalTitle = document.getElementById('modalTitle');
    const finalScoreText = document.getElementById('finalScoreText');
    const highScoreText = document.getElementById('highScoreText');
    const startBtn = document.getElementById('startBtn');
    const jumpBtn = document.getElementById('jumpBtn');
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playSound(type) {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'jump') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, now);
            osc.frequency.linearRampToValueAtTime(30, now + 0.3);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        }
    }
    let animationFrameId = null, groundY = 0, score = 0;
    let highScore = parseInt(localStorage.getItem('neon_runner_hi')) || 0;
    let gameSpeed = 7, isPlaying = false, gridOffset = 0;
    let player, obstacles = [], particles = [];
    function resize() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        groundY = canvas.height - 80;
        if (player) { player.baseY = groundY - player.size; if (!player.isJumping) player.y = player.baseY; }
    }
    class Player {
        constructor() {
            this.size = 36; this.x = Math.min(canvas.width * 0.15, 120);
            this.baseY = groundY - this.size; this.y = this.baseY;
            this.vy = 0; this.gravity = 0.75; this.jumpForce = -15.5;
            this.isJumping = false; this.trail = [];
        }
        jump() {
            if (!this.isJumping) {
                this.vy = this.jumpForce; this.isJumping = true;
                playSound('jump'); createJumpParticles(this.x + this.size / 2, this.y + this.size);
            }
        }
        update() {
            this.vy += this.gravity; this.y += this.vy;
            if (this.y >= this.baseY) { this.y = this.baseY; this.vy = 0; this.isJumping = false; }
            this.trail.push({ x: this.x, y: this.y });
            if (this.trail.length > 6) this.trail.shift();
        }
        draw() {
            this.trail.forEach((t, i) => { ctx.fillStyle = `rgba(0,243,255,${(i+1)/12})`; ctx.fillRect(t.x, t.y, this.size, this.size); });
            ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 15;
            ctx.fillStyle = '#00f3ff'; ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.fillStyle = '#fff'; ctx.fillRect(this.x+6, this.y+6, this.size-12, this.size-12);
            ctx.shadowBlur = 0;
        }
    }
    class Obstacle {
        constructor() {
            this.width = 25 + Math.random() * 20;
            this.height = 35 + Math.random() * 35;
            this.x = canvas.width + 50; this.y = groundY - this.height;
            this.color = Math.random() > 0.5 ? '#ff0055' : '#b000ff';
        }
        update() { this.x -= gameSpeed; }
        draw() {
            ctx.shadowColor = this.color; ctx.shadowBlur = 12;
            ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.width, this.height);
            ctx.fillStyle = '#fff'; ctx.fillRect(this.x+4, this.y+4, Math.max(2, this.width-8), Math.max(2, this.height-8));
            ctx.shadowBlur = 0;
        }
    }
    function createJumpParticles(x, y) {
        for (let i = 0; i < 8; i++) particles.push({ x, y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*3, size: Math.random()*4+2, alpha: 1, color: '#00f3ff' });
    }
    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
            if (p.alpha <= 0) particles.splice(i, 1);
            else { ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha; ctx.fillRect(p.x, p.y, p.size, p.size); ctx.globalAlpha = 1; }
        }
    }
    function drawEnvironment() {
        let bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bg.addColorStop(0, '#050510'); bg.addColorStop(1, '#1a002c');
        ctx.fillStyle = bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(176,0,255,0.15)'; ctx.lineWidth = 1;
        gridOffset = (gridOffset - gameSpeed * 0.5) % 40;
        for (let x = gridOffset; x < canvas.width; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, groundY); ctx.stroke();
        }
        ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 10;
        ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(0,243,255,0.05)';
        ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
    }
    function spawnObstacles() {
        if (obstacles.length === 0) obstacles.push(new Obstacle());
        else {
            let last = obstacles[obstacles.length - 1];
            let minGap = Math.max(220, 420 - gameSpeed * 10);
            if (canvas.width - last.x > minGap + Math.random() * 150) obstacles.push(new Obstacle());
        }
    }
    function checkCollision(r1, r2) {
        return r1.x < r2.x + r2.width && r1.x + r1.size > r2.x && r1.y < r2.y + r2.height && r1.y + r1.size > r2.y;
    }
    function gameOver() {
        isPlaying = false; playSound('crash');
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        if (score > highScore) { highScore = Math.floor(score); localStorage.setItem('neon_runner_hi', highScore); }
        modalTitle.textContent = "GAME OVER";
        finalScoreText.textContent = `النتيجة: ${Math.floor(score)}`;
        highScoreText.textContent = `أعلى نتيجة: ${highScore}`;
        finalScoreText.classList.remove('hidden');
        startBtn.textContent = "إعادة اللعب 🔄";
        gameModal.classList.remove('hidden');
    }
    function gameLoop() {
        if (!isPlaying) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawEnvironment();
        player.update(); player.draw();
        spawnObstacles();
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i]; obs.update(); obs.draw();
            if (checkCollision(player, obs)) { gameOver(); return; }
            if (obs.x + obs.width < 0) obstacles.splice(i, 1);
        }
        updateParticles();
        score += 0.15;
        gameSpeed = 7 + Math.floor(score / 150) * 0.8;
        scoreText.textContent = Math.floor(score);
        highScoreHUD.textContent = highScore;
        animationFrameId = requestAnimationFrame(gameLoop);
    }
    function startGame() {
        resize(); player = new Player(); obstacles = []; particles = [];
        score = 0; gameSpeed = 7; isPlaying = true;
        highScoreHUD.textContent = highScore;
        highScoreText.textContent = `أعلى نتيجة: ${highScore}`;
        gameModal.classList.add('hidden');
        gameLoop();
    }
    function handleJumpInput(e) {
        if (e) {
            if (e.type === 'keydown' && e.code !== 'Space' && e.code !== 'ArrowUp') return;
            if (e.type === 'keydown') e.preventDefault();
        }
        if (isPlaying && player) player.jump();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('keydown', handleJumpInput);
    jumpBtn.addEventListener('click', (e) => { e.stopPropagation(); handleJumpInput(); });
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleJumpInput(); }, { passive: false });
    canvas.addEventListener('mousedown', (e) => { if (e.button === 0) handleJumpInput(); });
    startBtn.addEventListener('click', startGame);
    resize();
    highScoreText.textContent = `أعلى نتيجة: ${highScore}`;
    highScoreHUD.textContent = highScore;
})();
</script>
</body>
</html>
