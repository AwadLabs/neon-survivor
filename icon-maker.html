<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مولّد الأيقونة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:20px;background:#0a0a0f;color:#f2f2f7;font-family:-apple-system,Tahoma,sans-serif;text-align:center}
  h1{font-size:20px;color:#00d68f;margin-bottom:8px}
  p{font-size:13px;color:#8b8ba3;margin-bottom:20px}
  .preview{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:20px}
  canvas{background:#0a0a0f;border-radius:22%;box-shadow:0 4px 20px rgba(0,214,143,.3)}
  button{display:block;width:100%;max-width:320px;margin:8px auto;padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:800;background:#00d68f;color:#04130d;font-family:inherit;cursor:pointer}
  button:active{transform:scale(.97)}
  button.ghost{background:#1b1b26;color:#00d68f;border:1px solid #262635}
</style>
</head>
<body>
  <h1>مولّد أيقونة صلاحية</h1>
  <p>انتظر ظهور حرف "ص" في المعاينة، ثم اضغط للتحميل</p>

  <div class="preview">
    <canvas id="c512" width="512" height="512" style="width:180px;height:180px"></canvas>
    <canvas id="c192" width="192" height="192" style="width:100px;height:100px"></canvas>
  </div>

  <button onclick="download(512)">📥 تحميل 512×512 (icon-512.png)</button>
  <button onclick="download(192)">📥 تحميل 192×192 (icon-192.png)</button>
  <button class="ghost" onclick="download(180)">📥 تحميل 180×180 (apple-touch-icon.png)</button>

<script>
function drawIcon(canvas){
  const ctx = canvas.getContext('2d');
  const s = canvas.width / 512;
  ctx.scale(s, s);

  // خلفية
  ctx.fillStyle = '#0a0a0f';
  if(ctx.roundRect){
    ctx.beginPath(); ctx.roundRect(0,0,512,512,113); ctx.fill();
  } else {
    ctx.fillRect(0,0,512,512);
  }

  // الهالة الخضراء
  const g = ctx.createRadialGradient(256,215,0, 256,215,280);
  g.addColorStop(0,'rgba(0,214,143,0.22)');
  g.addColorStop(1,'rgba(0,214,143,0)');
  ctx.fillStyle = g;
  if(ctx.roundRect){
    ctx.beginPath(); ctx.roundRect(0,0,512,512,113); ctx.fill();
  }

  // الإطار
  ctx.strokeStyle = 'rgba(0,214,143,0.3)';
  ctx.lineWidth = 4;
  if(ctx.roundRect){
    ctx.beginPath(); ctx.roundRect(5,5,502,502,108); ctx.stroke();
  }

  // حرف "ص"
  ctx.fillStyle = '#00d68f';
  ctx.shadowColor = '#00d68f';
  ctx.shadowBlur = 30;
  ctx.font = '900 290px Cairo, "Noto Kufi Arabic", "Noto Sans Arabic", Tahoma, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'rtl';
  ctx.fillText('ص', 256, 256);
  ctx.shadowBlur = 0;

  // 3 نقاط
  const dots = [
    {x:206, c:'#00d68f'},
    {x:256, c:'#ffb800'},
    {x:306, c:'#ff4d6d'}
  ];
  dots.forEach(d => {
    ctx.beginPath();
    ctx.arc(d.x, 420, 15, 0, Math.PI*2);
    ctx.fillStyle = d.c;
    ctx.fill();
  });
}

function download(size){
  const src = size >= 256 ? 'c512' : 'c192';
  const srcCanvas = document.getElementById(src);

  // نسخ بأي حجم مطلوب
  const tmp = document.createElement('canvas');
  tmp.width = size; tmp.height = size;
  const tctx = tmp.getContext('2d');
  tctx.drawImage(srcCanvas, 0, 0, size, size);

  tmp.toBlob(function(blob){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const name = size === 180 ? 'apple-touch-icon.png' : 'icon-' + size + '.png';
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, 'image/png');
}

// انتظر تحميل الخط ثم ارسم
if(document.fonts && document.fonts.ready){
  document.fonts.load('900 290px Cairo').then(() => {
    drawIcon(document.getElementById('c512'));
    drawIcon(document.getElementById('c192'));
  }).catch(() => {
    drawIcon(document.getElementById('c512'));
    drawIcon(document.getElementById('c192'));
  });
} else {
  setTimeout(() => {
    drawIcon(document.getElementById('c512'));
    drawIcon(document.getElementById('c192'));
  }, 1500);
}
</script>
</body>
</html>
