<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Runner v2 — Fixed</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }

        body {
            background-color: #05050d;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* FIX 1: تصميم متجاوب — ملء الشاشة على الجوال، 800×450 كحد أقصى على الديسكتوب */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            max-height: 100vh;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(0, 0, 0, 0.8);
            border: 2px solid #00f3ff;
            border-radius: 12px;
            overflow: hidden;
            background: radial-gradient(circle at center, #100b26 0%, #05050d 100%);
        }
        /* على الشاشات الصغيرة: ملء الشاشة بالكامل (أفقي أو عمودي) */
        @media (max-width: 820px) {
            #game-container {
                max-width: none;
                width: 100vw;
                height: 100vh;
                aspect-ratio: auto;
                border: none;
                border-radius: 0;
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none; /* FIX 4: منع التمرير/التحديد على iOS */
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 15, 0.88);
            backdrop-filter: blur(4px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; transition: opacity 0.3s ease; padding: 20px; text-align: center;
        }
        .hidden { display: none !important; }

        h1 {
            font-size: clamp(1.8rem, 6vw, 3.2rem);
            color: #00f3ff; text-shadow: 0 0 12px #00f3ff, 0 0 25px rgba(0,243,255,.6);
            font-weight: 900; margin-bottom: 5px; letter-spacing: 1px;
        }
        h2 {
            font-size: clamp(1.4rem, 4.5vw, 2.2rem);
            color: #ff00ff; text-shadow: 0 0 10px #ff00ff; margin-bottom: 15px; font-weight: 700;
        }
        p.subtitle { font-size: clamp(.85rem, 2.5vw, 1.1rem); color: #a0a0c0; margin-bottom: 25px; }

        .btn-group { display: flex; gap: 15px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
        .btn {
            background: rgba(0,243,255,.05); color: #00f3ff; border: 2px solid #00f3ff;
            padding: 10px 26px; font-size: clamp(.95rem, 2.6vw, 1.1rem); font-family: 'Cairo', sans-serif;
            font-weight: 700; border-radius: 6px; cursor: pointer; transition: all .2s ease-in-out;
            box-shadow: 0 0 10px rgba(0,243,255,.15); display: inline-flex; align-items: center; gap: 8px;
        }
        .btn:hover { background: #00f3ff; color: #050510; box-shadow: 0 0 20px #00f3ff; transform: translateY(-2px); }
        .btn-pink { color: #ff00ff; border-color: #ff00ff; box-shadow: 0 0 10px rgba(255,0,255,.15); background: rgba(255,0,255,.05); }
        .btn-pink:hover { background: #ff00ff; color: #050510; box-shadow: 0 0 20px #ff00ff; }
        .btn:disabled { opacity:.4; cursor:not-allowed; transform:none !important; box-shadow:none !important; border-color:#666 !important; color:#888 !important; }

        /* الشخصيات */
        .characters-grid { display: flex; gap: 18px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .char-card {
            background: rgba(255,255,255,.03); border: 2px solid rgba(255,255,255,.1);
            border-radius: 10px; padding: 15px; width: 210px; max-width: 84vw; text-align: center;
            cursor: pointer; transition: all .25s ease; position: relative;
        }
        .char-card:hover { border-color: rgba(255,255,255,.4); transform: translateY(-4px); }
        .char-card.selected { border-color: #00f3ff; box-shadow: 0 0 20px rgba(0,243,255,.4); background: rgba(0,243,255,.08); }
        .char-card.locked { opacity: .7; border-color: #ff0055; }
        .char-icon { font-size: 2.5rem; margin-bottom: 8px; display: block; }
        .char-name { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
        .char-desc { font-size: .82rem; color: #b0b0d0; margin-bottom: 10px; line-height: 1.3; min-height: 34px; }
        .char-stats { font-size: .78rem; color: #00f3ff; text-align: right; background: rgba(0,0,0,.3); padding: 6px 8px; border-radius: 4px; margin-top: 5px; }

        /* المتجر */
        .shop-items { display: flex; flex-direction: column; gap: 12px; width: min(460px, 92vw); margin-bottom: 20px; max-height: 50vh; overflow-y: auto; }
        .shop-item {
            background: rgba(255,255,255,.03); border: 1px solid rgba(0,243,255,.3);
            padding: 12px 18px; border-radius: 8px; display: flex; justify-content: space-between;
            align-items: center; text-align: right; gap: 10px;
        }
        .shop-item-info h4 { color: #00f3ff; font-size: 1.05rem; }
        .shop-item-info p { font-size: .82rem; color: #aaa; }

        /* HUD */
        .hud {
            position: absolute; top: 12px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
            z-index: 5; pointer-events: none; font-weight: 700; font-size: clamp(.72rem, 2.4vw, 1rem);
            flex-wrap: wrap;
        }
        .hud-item {
            background: rgba(5,5,18,.75); padding: 6px 12px; border-radius: 20px;
            border: 1px solid rgba(0,243,255,.4); box-shadow: 0 0 10px rgba(0,0,0,.5);
            display: flex; align-items: center; gap: 6px;
        }
        .coin-display { color: #ffd700; border-color: rgba(255,215,0,.5); text-shadow: 0 0 5px rgba(255,215,0,.5); }
        .boss-warning { color: #ff0055; border-color: #ff0055; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { box-shadow: 0 0 5px #ff0055; } to { box-shadow: 0 0 15px #ff0055; } }

        .controls-hint {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            font-size: .8rem; color: rgba(255,255,255,.4); pointer-events: none; z-index: 4;
        }
        /* FIX: إخفاء تلميح لوحة المفاتيح على أجهزة اللمس */
        @media (pointer: coarse) { .controls-hint { display: none; } }

        /* FIX: زر إيقاف عائم للجوال */
        #pauseFab {
            position: absolute; bottom: 12px; right: 12px; z-index: 6;
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(5,5,18,.75); border: 2px solid #00f3ff; color: #00f3ff;
            font-size: 18px; cursor: pointer; display: none;
        }

        /* FIX 6: تنبيهات منبثقة بدلاً من alert() */
        #toasts {
            position: absolute; top: 60px; right: 12px; z-index: 30;
            display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }
        .toast {
            background: rgba(10,0,30,.92); border: 1px solid #ffd700; color: #ffe;
            border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 700;
            box-shadow: 0 0 18px rgba(255,215,0,.35); animation: toastIn .3s ease;
        }
        @keyframes toastIn { from { transform: translateX(40px); opacity: 0; } }

        /* شاشة الإيقاف */
        #pauseScreen h2 { color: #00f3ff; text-shadow: 0 0 15px #00f3ff; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud" class="hud hidden">
            <div class="hud-item" id="hud-health">❤️ 3/3</div>
            <div class="hud-item coin-display" id="hud-coins">🪙 0</div>
            <div class="hud-item" id="hud-score">🏆 0</div>
            <div class="hud-item" id="hud-boss-timer">⏱️ الزعيم: 30ث</div>
        </div>

        <div class="controls-hint" id="controls-hint">[Space] / [↑] للقفز — القفز على رأس الأعداء يقضي عليهم!</div>
        <button id="pauseFab" title="إيقاف مؤقت">⏸</button>
        <div id="toasts"></div>

        <!-- القائمة الرئيسية -->
        <div id="main-menu" class="screen">
            <h1>NEON RUNNER v2</h1>
            <p class="subtitle">المستقبل مظلم، اركض، دمر الزعماء وابقَ على قيد الحياة</p>
            <div class="btn-group">
                <button type="button" class="btn" onclick="showCharacterSelect()">🚀 بدء اللعبة</button>
                <button type="button" class="btn btn-pink" onclick="openShop('menu')">🛒 المتجر</button>
            </div>
        </div>

        <!-- اختيار الشخصيات -->
        <div id="character-screen" class="screen hidden">
            <h2>اختر بطل النيون</h2>
            <div class="characters-grid" id="characters-container"></div>
            <div class="btn-group">
                <button type="button" class="btn" onclick="startGame()">⚡ انطلق الآن!</button>
                <button type="button" class="btn btn-pink" onclick="showMainScreen()">🔙 القائمة الرئيسية</button>
            </div>
        </div>

        <!-- المتجر -->
        <div id="shop-screen" class="screen hidden">
            <h2>متجر الترقية</h2>
            <p class="coin-display" id="shop-coins" style="font-size:1.3rem; margin-bottom:15px;">رصيدك: 🪙 0</p>
            <div class="shop-items" id="shop-container"></div>
            <button type="button" class="btn btn-pink" onclick="closeShop()">🔙 العودة</button>
        </div>

        <!-- نهاية اللعبة -->
        <div id="game-over-screen" class="screen hidden">
            <h2 style="color:#ff0055; text-shadow:0 0 15px #ff0055;">انتهت اللعبة</h2>
            <p id="final-score" style="font-size:1.3rem; margin: 5px 0;">النقاط: 0</p>
            <p id="final-coins" class="coin-display" style="font-size:1.2rem; margin-bottom: 20px;">العملات المكتسبة: 0🪙</p>
            <div class="btn-group">
                <button type="button" class="btn" onclick="restartGame()">🔄 اللعب مجدداً</button>
                <button type="button" class="btn btn-pink" onclick="openShop('gameover')">🛒 المتجر</button>
            </div>
        </div>

        <!-- FIX: شاشة إيقاف مؤقت -->
        <div id="pauseScreen" class="screen hidden">
            <h2>⏸ إيقاف مؤقت</h2>
            <div class="btn-group">
                <button type="button" class="btn" onclick="togglePause()">▶ استئناف</button>
                <button type="button" class="btn btn-pink" onclick="quitToMenu()">🏠 القائمة الرئيسية</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        "use strict";
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');

        /* ============================================================
           FIX 2 + 7: دقة Canvas ديناميكية مع DPR — الشاشة كلها مساحة لعب
           ============================================================ */
        let W = 800, H = 450, groundY = 380;
        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const rect = container.getBoundingClientRect();
            W = Math.max(320, rect.width);
            H = Math.max(240, rect.height);
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            groundY = H * 0.845; // خط الأرضية نسبي لأي ارتفاع
        }
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => setTimeout(resize, 100));
        resize();

        /* ============================================================
           مؤثرات صوتية بسيطة (Web Audio)
           ============================================================ */
        let AC = null;
        function initAudio() {
            if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
            if (AC && AC.state === 'suspended') AC.resume();
        }
        function beep(freq, dur, type, vol, slide) {
            if (!AC) return;
            type = type || 'square'; vol = vol || 0.12;
            const o = AC.createOscillator(), g = AC.createGain();
            o.type = type;
            o.frequency.setValueAtTime(freq, AC.currentTime);
            if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), AC.currentTime + dur);
            g.gain.setValueAtTime(vol, AC.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
            o.connect(g); g.connect(AC.destination);
            o.start(); o.stop(AC.currentTime + dur);
        }
        const sfx = {
            jump()  { beep(500, .12, 'square', .08, 300); },
            coin()  { beep(1200, .08, 'sine', .1, 400); },
            stomp() { beep(300, .12, 'sawtooth', .12, -150); },
            hurt()  { beep(160, .25, 'sawtooth', .14, -80); },
            boss()  { beep(70, .6, 'sawtooth', .16); },
            chest() { beep(660, .12, 'triangle', .12); setTimeout(() => beep(880, .2, 'triangle', .12), 130); },
            over()  { beep(280, .5, 'sawtooth', .14, -200); },
        };

        /* ============================================================
           FIX 6: تنبيهات منبثقة بدلاً من alert() المحظور
           ============================================================ */
        function toast(msg) {
            const t = document.createElement('div');
            t.className = 'toast'; t.textContent = msg;
            document.getElementById('toasts').appendChild(t);
            setTimeout(() => { t.style.opacity = 0; t.style.transition = 'opacity .4s'; setTimeout(() => t.remove(), 400); }, 2800);
        }

        /* ---------------- الحفظ ---------------- */
        const DEFAULT_DATA = {
            coins: 0,
            selectedChar: 'Shadow',
            unlockedChars: ['Shadow', 'Titan'],
            upgrades: { speed: 0, health: 0, doubleJump: false }
        };
        let gameData = loadGameData();
        function loadGameData() {
            try {
                const saved = localStorage.getItem('neonRunnerData_v2');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    return { ...DEFAULT_DATA, ...parsed, upgrades: { ...DEFAULT_DATA.upgrades, ...(parsed.upgrades || {}) } };
                }
            } catch (e) { console.error("Failed to load save data", e); }
            return JSON.parse(JSON.stringify(DEFAULT_DATA));
        }
        function saveGame() { localStorage.setItem('neonRunnerData_v2', JSON.stringify(gameData)); }

        /* ---------------- الشخصيات ---------------- */
        const CHARACTERS = {
            Shadow: { id:'Shadow', name:'Shadow', speed:6.5, jumpForce:-12.5, health:2, color:'#00f3ff', icon:'⚡',
                      desc:'سريع للغاية وقفزته عالية، لكن صحته منخفضة.', price:0 },
            Titan:  { id:'Titan', name:'Titan', speed:4.5, jumpForce:-9.5, health:5, color:'#ff0055', icon:'🛡️',
                      desc:'بطيء وقفزته منخفضة، لكنه يمتلك صحة درع عالية.', price:0 },
            Storm:  { id:'Storm', name:'Storm', speed:5.5, jumpForce:-11.0, health:3, color:'#bd00ff', icon:'🌀',
                      desc:'متوازن ويثبت جدارته بقفزة مزدوجة افتراضية.', price:500 },
        };

        /* ---------------- حالة اللعبة ---------------- */
        let gameState = 'MENU'; // MENU / CHAR_SELECT / SHOP / PLAYING / PAUSED / GAMEOVER
        let score = 0, sessionCoins = 0, gameTime = 0, bossTimer = 30;
        let obstacleSpawnTimer = 0, enemySpawnTimer = 0; // FIX 5: صارت ضمن reset
        let shopReturnTo = 'menu'; // FIX 3: تذكّر من أين فُتح المتجر

        let player = {
            x: 100, y: 0, width: 32, height: 44,
            vy: 0, isJumping: false, jumpCount: 0, maxJumps: 1,
            health: 3, maxHealth: 3, color: '#00f3ff', speed: 5, jumpForce: -11,
            invulnerableTimer: 0
        };

        let obstacles = [], enemies = [], coinsList = [], rewardChests = [];
        let boss = null, bossProjectiles = [], particles = [], floatTexts = [];

        // مراجع HUD مخزّنة (FIX 8: لا نستدعي getElementById كل إطار)
        const hudEls = {
            health: document.getElementById('hud-health'),
            coins: document.getElementById('hud-coins'),
            score: document.getElementById('hud-score'),
            boss: document.getElementById('hud-boss-timer'),
        };
        let hudUpdateT = 0; // تحديث HUD كل 100ms فقط

        /* ---------------- إدارة الشاشات ---------------- */
        function hideAllScreens() {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        }
        function showMainScreen() {
            gameState = 'MENU';
            document.getElementById('pauseFab').style.display = 'none';
            hideAllScreens();
            document.getElementById('main-menu').classList.remove('hidden');
        }
        function showCharacterSelect() {
            initAudio();
            gameState = 'CHAR_SELECT';
            hideAllScreens();
            document.getElementById('character-screen').classList.remove('hidden');
            renderCharacters();
        }
        function renderCharacters() {
            const containerEl = document.getElementById('characters-container');
            containerEl.innerHTML = '';
            Object.keys(CHARACTERS).forEach(key => {
                const char = CHARACTERS[key];
                const isUnlocked = gameData.unlockedChars.includes(key);
                const isSelected = gameData.selectedChar === key;
                const card = document.createElement('div');
                card.className = `char-card ${isSelected ? 'selected' : ''} ${!isUnlocked ? 'locked' : ''}`;
                card.innerHTML = `
                    <span class="char-icon" style="text-shadow: 0 0 10px ${char.color}">${char.icon}</span>
                    <div class="char-name" style="color: ${char.color}">${char.name}</div>
                    <div class="char-desc">${char.desc}</div>
                    <div class="char-stats">❤️ الصحة: ${char.health} | 👟 السرعة: ${char.speed}</div>
                    ${!isUnlocked ? `<div style="color:#ffd700; font-weight:bold; margin-top:8px;">فتح: 🪙 ${char.price}</div>` : ''}
                `;
                card.onclick = () => {
                    initAudio();
                    if (isUnlocked) {
                        gameData.selectedChar = key; saveGame(); renderCharacters();
                    } else if (gameData.coins >= char.price) {
                        gameData.coins -= char.price;
                        gameData.unlockedChars.push(key);
                        gameData.selectedChar = key;
                        saveGame(); renderCharacters();
                        toast(`✨ تم فتح ${char.name}!`);
                        sfx.chest();
                    } else {
                        toast(`تحتاج ${char.price}🪙 — رصيدك ${gameData.coins}🪙`);
                    }
                };
                containerEl.appendChild(card);
            });
        }

        /* ---------------- المتجر (FIX 3: عودة ذكية) ---------------- */
        function openShop(returnTo) {
            initAudio();
            shopReturnTo = returnTo || 'menu';
            gameState = 'SHOP';
            hideAllScreens();
            document.getElementById('shop-screen').classList.remove('hidden');
            renderShop();
        }
        function closeShop() {
            if (shopReturnTo === 'gameover') {
                gameState = 'GAMEOVER';
                hideAllScreens();
                document.getElementById('game-over-screen').classList.remove('hidden');
            } else {
                showMainScreen();
            }
        }
        function renderShop() {
            document.getElementById('shop-coins').innerText = `رصيدك: 🪙 ${gameData.coins}`;
            const containerEl = document.getElementById('shop-container');
            containerEl.innerHTML = '';
            const items = [
                { name:'سرعة إضافية', desc:`زيادة سرعة الحركة (+0.5). المستوى: ${gameData.upgrades.speed}/5 — تُطبَّق من الجولة القادمة`,
                  price:50, maxed: gameData.upgrades.speed >= 5,
                  action: () => { if (gameData.upgrades.speed < 5 && gameData.coins >= 50) { gameData.coins -= 50; gameData.upgrades.speed++; return true; } return false; } },
                { name:'صحة قصوى إضافية', desc:`زيادة الحد الأقصى للصحة (+1). المستوى: ${gameData.upgrades.health}/3 — تُطبَّق من الجولة القادمة`,
                  price:100, maxed: gameData.upgrades.health >= 3,
                  action: () => { if (gameData.upgrades.health < 3 && gameData.coins >= 100) { gameData.coins -= 100; gameData.upgrades.health++; return true; } return false; } },
                { name:'قفزة مزدوجة دائمة', desc:'تتيح القفز المزدوج لجميع الشخصيات بشكل دائم.',
                  price:200, maxed: gameData.upgrades.doubleJump,
                  action: () => { if (!gameData.upgrades.doubleJump && gameData.coins >= 200) { gameData.coins -= 200; gameData.upgrades.doubleJump = true; return true; } return false; } },
            ];
            items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'shop-item';
                el.innerHTML = `
                    <div class="shop-item-info"><h4>${item.name}</h4><p>${item.desc}</p></div>
                    <button type="button" class="btn" ${item.maxed ? 'disabled' : ''}>${item.maxed ? 'مكتمل ✔' : `🪙 ${item.price}`}</button>`;
                const btn = el.querySelector('button');
                if (!item.maxed) btn.onclick = () => {
                    initAudio();
                    if (item.action()) { saveGame(); renderShop(); sfx.coin(); }
                    else toast('لا تملك عملات كافية! 🪙');
                };
                containerEl.appendChild(el);
            });
        }

        /* ---------------- بدء / إنهاء / إيقاف ---------------- */
        function startGame() {
            initAudio();
            hideAllScreens();
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('pauseFab').style.display = 'block';
            gameState = 'PLAYING';

            const baseChar = CHARACTERS[gameData.selectedChar] || CHARACTERS.Shadow;
            player.speed = baseChar.speed + (gameData.upgrades.speed * 0.5);
            player.jumpForce = baseChar.jumpForce;
            player.maxHealth = baseChar.health + gameData.upgrades.health;
            player.health = player.maxHealth;
            player.color = baseChar.color;
            player.maxJumps = (gameData.upgrades.doubleJump || baseChar.id === 'Storm') ? 2 : 1;
            player.x = W * 0.12;
            player.y = groundY - player.height;
            player.vy = 0; player.isJumping = false; player.jumpCount = 0;
            player.invulnerableTimer = 0;

            score = 0; sessionCoins = 0; gameTime = 0; bossTimer = 30;
            obstacleSpawnTimer = 0; enemySpawnTimer = 0; // FIX 5: تصفير مؤقتات التوليد
            obstacles = []; enemies = []; coinsList = []; rewardChests = [];
            boss = null; bossProjectiles = []; particles = []; floatTexts = [];
        }
        function restartGame() { startGame(); }

        function gameOver() {
            gameState = 'GAMEOVER';
            gameData.coins += sessionCoins;
            saveGame();
            sfx.over();
            document.getElementById('pauseFab').style.display = 'none';
            document.getElementById('hud').classList.add('hidden');
            hideAllScreens();
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = `النقاط الإجمالية: ${Math.floor(score)}`;
            document.getElementById('final-coins').innerText = `العملات المحصلة: 🪙 ${sessionCoins}`;
        }

        /* FIX: نظام إيقاف مؤقت */
        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                hideAllScreens();
                document.getElementById('pauseScreen').classList.remove('hidden');
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                document.getElementById('pauseScreen').classList.add('hidden');
            }
        }
        function quitToMenu() { showMainScreen(); }
        document.getElementById('pauseFab').addEventListener('click', () => { initAudio(); togglePause(); });
        // إيقاف تلقائي عند مغادرة التبويب
        document.addEventListener('visibilitychange', () => { if (document.hidden && gameState === 'PLAYING') togglePause(); });

        /* ---------------- التحكم (FIX 4: أحداث موحّدة تعمل على iOS) ---------------- */
        function handleJump() {
            if (gameState !== 'PLAYING') return;
            if (!player.isJumping || player.jumpCount < player.maxJumps) {
                player.vy = player.jumpForce;
                player.isJumping = true;
                player.jumpCount++;
                createParticles(player.x + player.width/2, player.y + player.height, player.color, 8);
                sfx.jump();
            }
        }
        window.addEventListener('keydown', e => {
            // FIX: منع تمرير الصفحة بمسافة/أسهم + منع تكرار القفز عند الضغط المطوّل
            if (['Space','ArrowUp','KeyW'].includes(e.code)) {
                e.preventDefault();
                if (!e.repeat) handleJump();
            }
            if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
        });
        // pointerdown موحّد: يعمل باللمس والفأرة معاً (iOS Safari متوافق)
        canvas.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); handleJump(); });

        /* ---------------- الجسيمات والنصوص ---------------- */
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({ x, y, vx:(Math.random()-.5)*7, vy:(Math.random()-.5)*7, alpha:1, color, size:Math.random()*4+2 });
            }
        }
        function addFloatingText(text, x, y, color) {
            floatTexts.push({ text, x, y, alpha:1, color: color || '#ffd700' });
        }

        /* ---------------- التحديث ---------------- */
        function update(dt) {
            if (gameState !== 'PLAYING') return;

            /* FIX (خطأ جديد #1): فizياء مستقلة عن معدل الإطارات —
               كل الحركات تُضرب في STEP = dt*60 لتتساوى السرعة على 60Hz و120Hz */
            const STEP = dt * 60;

            gameTime += dt;
            score += dt * 15;
            if (player.invulnerableTimer > 0) player.invulnerableTimer -= dt;

            if (!boss) {
                bossTimer -= dt;
                if (bossTimer <= 0) spawnBoss();
            }

            // فيزياء اللاعب
            player.vy += 0.55 * STEP;
            player.y += player.vy * STEP;
            if (player.y >= groundY - player.height) {
                player.y = groundY - player.height;
                player.vy = 0; player.isJumping = false; player.jumpCount = 0;
            }

            // توليد العوائق والأعداء (يتوقف أثناء الزعيم)
            if (!boss) {
                obstacleSpawnTimer += dt;
                if (obstacleSpawnTimer > 2.2 - Math.min(score/2000, 0.8)) {
                    if (Math.random() < 0.6) {
                        obstacles.push({ x: W, y: groundY - 28, width: 22, height: 28, color: '#ff0055' });
                    }
                    obstacleSpawnTimer = 0;
                }
                enemySpawnTimer += dt;
                if (enemySpawnTimer > 3.5 - Math.min(score/3000, 1.0)) {
                    enemies.push({ x: W, y: groundY - 32, width: 30, height: 32, color: '#ffbb00', vx: player.speed * 0.75 });
                    enemySpawnTimer = 0;
                }
            }

            // العوائق
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= player.speed * STEP;
                if (checkCollision(player, obs)) takeDamage();
                if (obs.x + obs.width < 0) obstacles.splice(i, 1);
            }

            // الأعداء
            for (let i = enemies.length - 1; i >= 0; i--) {
                const en = enemies[i];
                en.x -= en.vx * STEP;
                if (checkCollision(player, en)) {
                    if (player.vy > 0 && (player.y + player.height - player.vy) <= en.y + 12) {
                        enemies.splice(i, 1);
                        player.vy = -9;
                        /* FIX (خطأ جديد #2): كان اللاعب يأخذ +1 فوراً + عملة تمنح +1 عند التقاطها = مكافأة مزدوجة!
                           الآن: الدهس يولّد 3 عملات فيجب جمعها فعلاً */
                        for (let c = 0; c < 3; c++) {
                            coinsList.push({ x: en.x + en.width/2 + (c-1)*14, y: en.y, vy: -4 - c, vx: (c-1)*1.5 });
                        }
                        createParticles(en.x + en.width/2, en.y + en.height/2, '#ffbb00', 12);
                        sfx.stomp();
                    } else takeDamage();
                } else if (en.x + en.width < 0) enemies.splice(i, 1);
            }

            // الزعيم
            if (boss) {
                boss.yAngle += dt * 2;
                boss.y = (groundY - 120) + Math.sin(boss.yAngle) * 25;
                boss.shootTimer += dt;
                if (boss.shootTimer > 1.8) {
                    bossProjectiles.push({ x: boss.x, y: boss.y + boss.height/2 + (Math.random()*20 - 10), width: 18, height: 10, speed: 7 });
                    boss.shootTimer = 0;
                }
                if (checkCollision(player, boss)) {
                    if (player.vy > 0 && (player.y + player.height - player.vy) <= boss.y + 25) {
                        boss.health--;
                        player.vy = -11;
                        createParticles(boss.x, boss.y + 20, '#ff00ff', 20);
                        addFloatingText('-1 HP', boss.x, boss.y, '#ff00ff');
                        sfx.stomp();
                        if (boss.health <= 0) {
                            rewardChests.push({ x: boss.x + boss.width/4, y: boss.y, width: 35, height: 35, vy: -5 });
                            createParticles(boss.x + boss.width/2, boss.y + boss.height/2, '#ff00ff', 50);
                            addFloatingText('هزمت الزعيم! 🎉', boss.x, boss.y - 30, '#00f3ff');
                            boss = null;
                            bossTimer = 30;
                            sfx.chest();
                        }
                    } else takeDamage();
                }
            }

            // قذائف الزعيم
            for (let i = bossProjectiles.length - 1; i >= 0; i--) {
                const bp = bossProjectiles[i];
                bp.x -= bp.speed * STEP;
                if (checkCollision(player, bp)) { takeDamage(); bossProjectiles.splice(i, 1); }
                else if (bp.x < 0) bossProjectiles.splice(i, 1);
            }

            // صناديق المكافآت
            for (let i = rewardChests.length - 1; i >= 0; i--) {
                const chest = rewardChests[i];
                chest.x -= player.speed * 0.8 * STEP;
                chest.y += chest.vy * STEP;
                chest.vy += 0.3 * STEP;
                if (chest.y >= groundY - chest.height) { chest.y = groundY - chest.height; chest.vy = 0; }
                if (checkCollision(player, chest)) {
                    sessionCoins += 50;
                    addFloatingText('+50 عملة! 🎁', player.x, player.y - 20, '#ffd700');
                    createParticles(chest.x, chest.y, '#ffd700', 30);
                    sfx.chest();
                    rewardChests.splice(i, 1);
                }
            }

            // العملات
            for (let i = coinsList.length - 1; i >= 0; i--) {
                const c = coinsList[i];
                c.x += (c.vx !== undefined ? c.vx : -player.speed) * STEP;
                c.y += c.vy * STEP;
                c.vy += 0.3 * STEP;
                if (c.y >= groundY - 12) { c.y = groundY - 12; c.vy = 0; c.vx = -player.speed; }
                const dx = (player.x + player.width/2) - c.x;
                const dy = (player.y + player.height/2) - c.y;
                if (Math.hypot(dx, dy) < 32) {
                    sessionCoins += 1;
                    sfx.coin();
                    coinsList.splice(i, 1);
                } else if (c.x < -20) coinsList.splice(i, 1);
            }

            // الجسيمات والنصوص (مقيسة بالزمن أيضاً)
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * STEP; p.y += p.vy * STEP; p.alpha -= 0.025 * STEP;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
            for (let i = floatTexts.length - 1; i >= 0; i--) {
                const ft = floatTexts[i];
                ft.y -= STEP; ft.alpha -= 0.018 * STEP;
                if (ft.alpha <= 0) floatTexts.splice(i, 1);
            }

            /* FIX 8: تحديث HUD كل 0.1 ثانية فقط (كان كل إطار = 60-120 كتابة DOM/ثانية) */
            hudUpdateT += dt;
            if (hudUpdateT > 0.1) {
                hudUpdateT = 0;
                hudEls.health.innerText = `❤️ ${player.health}/${player.maxHealth}`;
                hudEls.coins.innerText = `🪙 ${sessionCoins}`;
                hudEls.score.innerText = `🏆 ${Math.floor(score)}`;
                if (boss) {
                    hudEls.boss.innerText = `⚠️ الزعيم نشط! (${boss.health}/5)`;
                    hudEls.boss.classList.add('boss-warning');
                } else {
                    hudEls.boss.innerText = `⏱️ الزعيم بعد: ${Math.ceil(bossTimer)}ث`;
                    hudEls.boss.classList.remove('boss-warning');
                }
            }
        }

        function spawnBoss() {
            boss = {
                x: W - 110, y: groundY - 120, width: 75, height: 90,
                health: 5, maxHealth: 5, shootTimer: 0, color: '#ff00ff', yAngle: 0
            };
            addFloatingText('⚠️ ظهر الزعيم! اقفز على رأسه!', W/2 - 80, H*0.2, '#ff0055');
            sfx.boss();
        }

        function takeDamage() {
            if (player.invulnerableTimer > 0) return;
            player.health--;
            player.invulnerableTimer = 1.2;
            createParticles(player.x + player.width/2, player.y + player.height/2, '#ff0055', 25);
            sfx.hurt();
            if (player.health <= 0) gameOver();
        }

        function checkCollision(r1, r2) {
            return r1.x < r2.x + r2.width && r1.x + r1.width > r2.x &&
                   r1.y < r2.y + r2.height && r1.y + r1.height > r2.y;
        }

        /* ---------------- الرسم ---------------- */
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // شبكة النيون المتحركة
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.04)';
            ctx.lineWidth = 1;
            const gridOffset = (gameTime * player.speed * 10) % 40;
            for (let x = -gridOffset; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
            for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

            // خط الأرضية
            ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 3;
            ctx.shadowBlur = 12; ctx.shadowColor = '#00f3ff';
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
            ctx.shadowBlur = 0;

            if (gameState === 'PLAYING' || gameState === 'PAUSED' || gameState === 'GAMEOVER') {
                ctx.fillStyle = '#ff0055'; ctx.shadowBlur = 10; ctx.shadowColor = '#ff0055';
                obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.width, o.height));

                ctx.fillStyle = '#ffbb00'; ctx.shadowColor = '#ffbb00';
                enemies.forEach(en => ctx.fillRect(en.x, en.y, en.width, en.height));

                ctx.fillStyle = '#ffd700'; ctx.shadowColor = '#ffd700';
                coinsList.forEach(c => { ctx.beginPath(); ctx.arc(c.x, c.y, 7, 0, Math.PI*2); ctx.fill(); });

                rewardChests.forEach(ch => {
                    ctx.fillStyle = '#ffd700'; ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 15;
                    ctx.fillRect(ch.x, ch.y, ch.width, ch.height);
                    ctx.fillStyle = '#000'; ctx.fillRect(ch.x + 10, ch.y + 10, ch.width - 20, ch.height - 20);
                });

                if (boss) {
                    ctx.fillStyle = boss.color; ctx.shadowBlur = 20; ctx.shadowColor = boss.color;
                    ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
                    ctx.fillStyle = '#fff'; ctx.fillRect(boss.x + 15, boss.y + 20, 18, 18);
                    ctx.fillStyle = '#ff0000'; ctx.fillRect(boss.x + 18, boss.y + 24, 8, 8);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(boss.x - 5, boss.y - 18, boss.width + 10, 10);
                    ctx.fillStyle = '#ff00ff'; ctx.fillRect(boss.x - 5, boss.y - 18, (boss.width + 10) * (boss.health / boss.maxHealth), 10);
                }

                ctx.fillStyle = '#00ffff'; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 10;
                bossProjectiles.forEach(bp => ctx.fillRect(bp.x, bp.y, bp.width, bp.height));

                if (player.invulnerableTimer <= 0 || Math.floor(gameTime * 20) % 2 === 0) {
                    ctx.fillStyle = player.color; ctx.shadowBlur = 15; ctx.shadowColor = player.color;
                    ctx.fillRect(player.x, player.y, player.width, player.height);
                    ctx.fillStyle = '#050510'; ctx.fillRect(player.x + player.width - 10, player.y + 8, 6, 8);
                }
                ctx.shadowBlur = 0;

                particles.forEach(p => {
                    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                ctx.globalAlpha = 1;

                ctx.font = 'bold 16px Cairo';
                floatTexts.forEach(ft => {
                    ctx.fillStyle = ft.color; ctx.globalAlpha = Math.max(0, ft.alpha);
                    ctx.fillText(ft.text, ft.x, ft.y);
                });
                ctx.globalAlpha = 1;
            }
        }

        /* ---------------- الحلقة الرئيسية ---------------- */
        let lastTime = 0;
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            // FIX: dt مُقيّد بـ 50ms — عند الرجوع من إيقاف مؤقت/تبويب لا تقفز الفيزياء
            const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;
            update(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
